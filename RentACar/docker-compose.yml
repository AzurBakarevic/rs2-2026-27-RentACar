name: rentacar

services:
  rentacar-sql:
    image: mcr.microsoft.com/mssql/server:2022-CU28-ubuntu-22.04
    container_name: rentacar-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "${SQL_HOST_PORT}:1433"
    volumes:
      - rentacar-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - rentacar

  rentacar-rabbitmq:
    image: rabbitmq:4.3.8-management
    container_name: rentacar-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RabbitMQ__Username}
      RABBITMQ_DEFAULT_PASS: ${RabbitMQ__Password}
    ports:
      - "${RABBITMQ_HOST_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT}:15672"
    volumes:
      - rentacar-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - rentacar

  rentacar-api:
    build:
      context: .
      dockerfile: RentACar.WebAPI/Dockerfile
    container_name: rentacar-api
    env_file: .env
    environment:
      ConnectionStrings__RentACar: ${DOCKER_ConnectionStrings__RentACar}
      RabbitMQ__Host: ${DOCKER_RabbitMQ__Host}
      RabbitMQ__Port: ${DOCKER_RabbitMQ__Port}
    ports:
      - "${API_HOST_PORT}:8080"
    depends_on:
      rentacar-sql:
        condition: service_healthy
      rentacar-rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rentacar

  rentacar-worker:
    build:
      context: .
      dockerfile: RentACar.Worker/Dockerfile
    container_name: rentacar-worker
    env_file: .env
    environment:
      RabbitMQ__Host: ${DOCKER_RabbitMQ__Host}
      RabbitMQ__Port: ${DOCKER_RabbitMQ__Port}
    depends_on:
      rentacar-rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rentacar

volumes:
  rentacar-sql-data:
  rentacar-rabbitmq-data:

networks:
  rentacar:
